kind: 'AppHostingYaml'
version: 'v1'

runConfig:
  maxInstances: 1

run:
  # On force npm install qui va reconstruire un environnement propre
  # Le flag --legacy-peer-deps est vital ici vu tes erreurs de dépendances
  command: npm install --legacy-peer-deps && npm run build
  serve:
    runtime: nodejs20

env:
  - variable: NPM_CONFIG_LEGACY_PEER_DEPS
    value: "true"
