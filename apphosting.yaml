kind: 'AppHostingYaml'
version: 'v1'

runConfig:
  maxInstances: 1

run:
  # Le --force va écraser le petit lockfile pour installer tout le projet proprement
  command: npm install --legacy-peer-deps --force && npm run build
  serve:
    runtime: nodejs20

env:
  - variable: NPM_CONFIG_LEGACY_PEER_DEPS
    value: "true"
