kind: 'AppHostingYaml'
version: 'v1'

runConfig:
  maxInstances: 1

run:
  # On force npm install car ton projet a besoin de recalculer les liens
  command: npm install --legacy-peer-deps && npm run build
  serve:
    runtime: nodejs20

env:
  - variable: NPM_CONFIG_LEGACY_PEER_DEPS
    value: "true"
