kind: 'AppHostingYaml'
version: 'v1'

runConfig:
  maxInstances: 1

run:
  # On ajoute --no-package-lock pour dire à Firebase : 
  # "Ne cherche pas de fichier lock, crée tout maintenant"
  command: npm install --legacy-peer-deps --no-package-lock && npm run build
  serve:
    runtime: nodejs20

env:
  - variable: NPM_CONFIG_LEGACY_PEER_DEPS
    value: "true"
